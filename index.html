<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Primavera 🌻</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--d1:#2c1b3d;--d2:#4a2a4f;--yellow:#f5b942;--dark:#a8621c;--pink:#e8547c;--pink-dark:#b23a5c;--green:#3f7a45;--cream:#fff6e6}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Quicksand,sans-serif;background:var(--d1);color:var(--cream)}.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:24px;text-align:center;opacity:0;visibility:hidden;transition:opacity .8s}.screen.active{opacity:1;visibility:visible}h1,h2{font-family:'Playfair Display',serif;line-height:1.15}.back-btn{position:absolute;top:16px;left:16px;background:#ffffff1f;border:1px solid #ffffff40;color:var(--cream);padding:8px 14px;border-radius:20px;cursor:pointer}.press-btn{position:relative;z-index:5;background:var(--yellow);color:var(--d1);border:0;font:700 1.15rem Quicksand;padding:16px 38px;border-radius:40px;cursor:pointer;box-shadow:0 6px var(--dark)}#screen-fall,#screen-ask{background:radial-gradient(ellipse at 50% 20%,var(--d2),var(--d1) 70%)}#screen-fall h1{position:relative;z-index:5;max-width:20ch}.fall-container{position:absolute;inset:0;overflow:hidden;pointer-events:none}.falling-flower{position:absolute;top:-60px;animation:fall linear infinite,spin linear infinite}@keyframes fall{from{transform:translateY(-10vh)}to{transform:translateY(110vh)}}@keyframes spin{from{rotate:0deg}to{rotate:360deg}}.options{display:flex;flex-direction:column;gap:16px;width:100%;max-width:340px}.opt-btn{font:600 1.05rem Quicksand;padding:16px 20px;border-radius:16px;border:2px solid transparent;cursor:pointer}.opt-1{background:var(--cream);color:var(--d1)}.opt-2{background:var(--pink);color:var(--cream)}.opt-3{background:var(--yellow);color:var(--d1);font-weight:700}#screen-tulips{background:linear-gradient(var(--d1),#6b2f47)}.bouquet{display:flex;gap:6px;align-items:flex-end}.tulip{width:44px;height:130px;position:relative;animation:sway 3.2s ease-in-out infinite;transform-origin:bottom}.tulip:nth-child(2){animation-delay:.3s}.tulip:nth-child(3){animation-delay:.6s}.tulip:nth-child(4){animation-delay:.15s}.tulip:nth-child(5){animation-delay:.45s}@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}.tulip-stem{position:absolute;bottom:0;left:50%;width:4px;height:78px;background:var(--green);transform:translateX(-50%)}.tulip-leaf{position:absolute;bottom:20px;left:50%;width:26px;height:12px;background:var(--green);border-radius:0 60%}.tulip-head{position:absolute;top:0;left:50%;transform:translateX(-50%);width:40px;height:46px}.tulip-petal{position:absolute;width:22px;height:38px;background:linear-gradient(var(--pink),var(--pink-dark));border-radius:50%}.p1{left:0;transform:rotate(-14deg)}.p2{left:9px;z-index:2}.p3{right:0;transform:rotate(14deg)}#screen-heart{background:linear-gradient(var(--d1),#3a2450);overflow-y:auto;padding:40px 20px}.heart-grid{position:relative;margin:0 auto 20px}.heart-tile{position:absolute;border-radius:8px;background:var(--yellow) center/cover;border:2px solid var(--cream);box-shadow:0 3px 8px #0008}#screen-heart h2{color:var(--yellow);font-size:1.5rem}#screen-flower{background:radial-gradient(ellipse at 50% 15%,var(--d2),var(--d1) 70%);flex-direction:row;flex-wrap:wrap;align-items:flex-start;padding-top:30px;overflow-y:auto}.flower-hero{width:100%;display:flex;flex-direction:column;align-items:center}.sunflower-big{width:130px;height:130px;position:relative;animation:spin 14s linear infinite}.petal-big{position:absolute;width:26px;height:54px;background:linear-gradient(var(--yellow),#d99a1f);border-radius:50% 50% 0 0;top:0;left:52px;transform-origin:bottom}.flower-center-big{position:absolute;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle,#7a4a1e,#4a2c10);top:42px;left:42px}.flower-hero h2,.col-title{color:var(--yellow)}.two-col{display:flex;width:100%;gap:18px;flex-wrap:wrap;justify-content:center}.col{flex:1 1 260px;max-width:340px;min-width:240px}.col-title{text-align:left;font:1.05rem 'Playfair Display',serif;margin-bottom:12px}.phrase-list,.song-list{display:flex;flex-direction:column;gap:8px}.phrase-item,.song-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#ffffff0f;border:1px solid #ffffff1f;border-radius:12px;padding:10px 12px;text-align:left}.phrase-item{cursor:pointer}.phrase-item.selected,.song-item.playing{border-color:var(--yellow);background:#f5b9422e}.phrase-text,.song-name{font-size:.85rem}.song-actions button{background:var(--yellow);color:var(--d1);border:0;border-radius:20px;padding:6px 10px;cursor:pointer;font-weight:700}.now-playing{margin-top:12px;font-size:.8rem;min-height:1.2em}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="screen-fall" class="screen active"><div class="fall-container" id="fallContainer"></div><h1>Tengo algo para vos 🌻</h1><button class="press-btn" onclick="goTo('screen-ask')">Presioná</button></div>
<div id="screen-ask" class="screen"><button class="back-btn" onclick="goTo('screen-fall')">← Volver</button><h1>¿Te gustó?</h1><div class="options"><button class="opt-btn opt-1" onclick="goTo('screen-tulips')">Sí</button><button class="opt-btn opt-2" onclick="goTo('screen-heart')">Súper sí</button><button class="opt-btn opt-3" onclick="goTo('screen-flower')">¡Eres asombrosa y guapa, mega sí!</button></div></div>
<div id="screen-tulips" class="screen"><button class="back-btn" onclick="goTo('screen-ask')">← Volver</button><div class="bouquet">${'<div class="tulip"><div class="tulip-leaf"></div><div class="tulip-stem"></div><div class="tulip-head"><div class="tulip-petal p1"></div><div class="tulip-petal p2"></div><div class="tulip-petal p3"></div></div></div>'.repeat(5)}</div><p>Un ramo para vos, con cariño 💛</p></div>
<div id="screen-heart" class="screen"><button class="back-btn" onclick="goTo('screen-ask')">← Volver</button><div class="heart-grid" id="heartGrid"></div><h2>Feliz inicio de primavera, mi amor</h2><p>Cada cuadrito es un recuerdo nuestro 💛</p></div>
<div id="screen-flower" class="screen"><button class="back-btn" onclick="goTo('screen-ask')">← Volver</button><div class="flower-hero"><div class="sunflower-big" id="bigSun"></div><h2>Para la más asombrosa 🌻</h2></div><div class="two-col"><div class="col"><div class="col-title">Frases para vos</div><div class="phrase-list" id="phraseList"></div></div><div class="col"><div class="col-title">Nuestra playlist</div><div class="song-list" id="songList"></div><div class="now-playing" id="nowPlaying"></div><audio id="playerAudio" controls></audio></div></div></div>
<script>
function goTo(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}
function makeSunflowerHTML(size){let p='';for(let i=0;i<10;i++)p+=`<div style="position:absolute;width:${size*.16}px;height:${size*.36}px;background:linear-gradient(#f5b942,#d99a1f);border-radius:50% 50% 0 0;top:0;left:${size*.42}px;transform-origin:bottom;transform:rotate(${i*36}deg)"></div>`;return `<div style="position:relative;width:${size}px;height:${size}px">${p}<div style="position:absolute;width:${size*.36}px;height:${size*.36}px;border-radius:50%;background:#5c3a18;top:${size*.32}px;left:${size*.32}px"></div></div>`}
for(let i=0;i<16;i++){let e=document.createElement('div');e.className='falling-flower';let s=24+Math.random()*28;e.innerHTML=makeSunflowerHTML(s);e.style.left=Math.random()*100+'vw';let f=6+Math.random()*6,sp=3+Math.random()*4;e.style.animationDuration=`${f}s,${sp}s`;e.style.animationDelay=`-${Math.random()*f}s,-${Math.random()*sp}s`;fallContainer.appendChild(e)}
const mask=['01010','11111','11111','01110','00100'],fotos=['foto 1.jpg','foto 2.JPEG','foto 3.jpeg','foto 4.jpeg','foto 5.jpeg','foto 6.jpeg','foto 7.jpeg','foto 8.jpeg','foto 9.jpeg','foto 10.jpeg','foto 11.JPEG','foto 12.JPEG','foto 13.JPEG','foto 14.PNG','foto 15.PNG','foto 16.JPEG'],grid=document.getElementById('heartGrid'),size=58,gap=6;grid.style.width=5*(size+gap)+'px';grid.style.height=5*(size+gap)+'px';let n=0;mask.forEach((row,r)=>[...row].forEach((cell,c)=>{if(cell==='1'){let t=document.createElement('div');t.className='heart-tile';t.style.cssText=`width:${size}px;height:${size}px;top:${r*(size+gap)}px;left:${c*(size+gap)}px;background-image:url("${encodeURI('fotos/'+fotos[n++])}")`;grid.appendChild(t)}}));
let petals='';for(let i=0;i<12;i++)petals+=`<div class="petal-big" style="transform:rotate(${i*30}deg)"></div>`;bigSun.innerHTML=petals+'<div class="flower-center-big"></div>';
const phrases=['Cada día contigo es mi flor favorita 🌻','Sos la razón de mi mejor sonrisa','Con vos hasta lo simple se vuelve especial','Me encanta girar mi día alrededor tuyo','Sos mi lugar favorito para volver','Feliz inicio de primavera, te amo'];phrases.forEach((text,i)=>{let e=document.createElement('div');e.className='phrase-item';e.innerHTML=`<span>🌻</span><span class="phrase-text">${text}</span>`;e.onclick=()=>{document.querySelectorAll('.phrase-item').forEach(x=>x.classList.remove('selected'));e.classList.add('selected');playTrack(i)};phraseList.appendChild(e)});
const tracks=[{title:'TWICE What is love ; sub español.mp3',file:'TWICE What is love ; sub español.mp3'},{title:'MILO J, BHAVI - OJALA.mp3',file:'MILO J, BHAVI - OJALA.mp3'},{title:'iKON - LOVE SCENARIO',file:'iKON - (LOVE SCENARIO)’ M V.mp3'},{title:'TXT-Run Away (Sub. Español).mp3',file:'TXT-Run Away (Sub. Español).mp3'},{title:'Callejeros - 9 de Julio (Letra).mp3',file:'Callejeros - 9 de Julio (Letra).mp3'},{title:'TWICE - LIKEY - (Sub Español) MV.mp3',file:'TWICE - LIKEY - (Sub Español) MV.mp3'}];tracks.forEach((track,i)=>{let e=document.createElement('div');e.className='song-item';e.id='song-'+i;e.innerHTML=`<span class="song-name">${track.title}</span><span class="song-actions"><button type="button">▶</button></span>`;e.querySelector('button').onclick=()=>playTrack(i);songList.appendChild(e)});
function playTrack(i){document.querySelectorAll('.song-item').forEach(e=>e.classList.remove('playing'));document.getElementById('song-'+i).classList.add('playing');playerAudio.src='canciones/'+encodeURIComponent(tracks[i].file).replace(/%2F/g,'/');playerAudio.load();playerAudio.play().then(()=>nowPlaying.textContent='▶ Sonando: '+tracks[i].title).catch(()=>nowPlaying.textContent='No se pudo reproducir esta canción. Probá nuevamente.')} 
</script>
</body>
</html>
