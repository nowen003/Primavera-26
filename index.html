<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Primavera 🌻</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,600&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --dusk-1:#2c1b3d;
    --dusk-2:#4a2a4f;
    --sunflower:#f5b942;
    --sunflower-dark:#a8621c;
    --tulip:#e8547c;
    --tulip-dark:#b23a5c;
    --leaf:#3f7a45;
    --cream:#fff6e6;
    --ink:#2c1b3d;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    font-family:'Quicksand', sans-serif;
    background:var(--dusk-1);
    color:var(--cream);
  }
  .screen{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column;
    opacity:0; visibility:hidden;
    transition:opacity .8s ease;
    padding:24px;
    text-align:center;
  }
  .screen.active{opacity:1; visibility:visible;}

  h1,h2{
    font-family:'Playfair Display', serif;
    font-weight:700;
    margin:0 0 18px 0;
    line-height:1.15;
  }

  /* ---------- SCREEN 1: falling sunflowers ---------- */
  #screen-fall{ background: radial-gradient(ellipse at 50% 20%, var(--dusk-2), var(--dusk-1) 70%); }
  .fall-container{position:absolute; inset:0; overflow:hidden; pointer-events:none;}
  .falling-flower{
    position:absolute; top:-60px;
    animation-name: fall, spin;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  @keyframes fall{
    from{ transform: translateY(-10vh); }
    to{ transform: translateY(110vh); }
  }
  @keyframes spin{
    from{ rotate: 0deg; }
    to{ rotate: 360deg; }
  }
  .press-btn{
    position:relative; z-index:5;
    background:var(--sunflower);
    color:var(--ink);
    border:none;
    font-family:'Quicksand', sans-serif;
    font-weight:700;
    font-size:1.15rem;
    padding:16px 38px;
    border-radius:40px;
    cursor:pointer;
    box-shadow:0 6px 0 var(--sunflower-dark);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .press-btn:active{ transform:translateY(6px); box-shadow:0 0 0 var(--sunflower-dark); }
  #screen-fall h1{ position:relative; z-index:5; font-size:2rem; max-width:20ch; }
